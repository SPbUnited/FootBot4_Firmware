; [platformio]
; lib_dir = ../..

[env:disco_f429zi]
platform = ststm32
board = disco_f429zi
framework = stm32cube

; debug_tool = jlink

; SWD interface
; upload_protocol = jlink

debug_tool = stlink
upload_protocol = stlink

monitor_speed = 115200

board_build.mcu = stm32f429zit6
board_build.f_cpu = 180000000L
; board_build.f_cpu = 180000000L
build_flags =
    -D HSE_VALUE=12000000UL
    ; Для OLED дисплея:
    -DOLED_SSD1315_ENABLE=1
    ; Для STM32 HAL:
    -DOLED_PLATFORM_STM32HAL=1
    -DSTM32F4
    -Wall -Wextra -Werror -Wno-missing-field-initializers

; lib_deps = 
    ; boriasrazor/oled_ssd1315@^3.0.1
    ; oled_ssd1315
